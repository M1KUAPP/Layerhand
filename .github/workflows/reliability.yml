# Nightly reliability (#10), guarded by RELIABILITY_ENABLED, plus a manual
# deployed-agent acceptance run. The scheduled job reads its runtime keys from
# their existing stores; acceptance uses only DATABASE_URL to read its run log.
name: Reliability

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: Live evidence to collect
        required: true
        type: choice
        options:
          - agent-loop-acceptance
          - reliability

permissions:
  contents: read

env:
  PROJECT_ID: layerhand-astra-2026
  WORKLOAD_IDENTITY_PROVIDER: projects/732371853772/locations/global/workloadIdentityPools/github/providers/github
  DEPLOYER: deployer@layerhand-astra-2026.iam.gserviceaccount.com
  PUBLIC_URL: https://layerhand-732371853772.us-central1.run.app

jobs:
  reliability:
    name: Reliability suite
    if: >-
      (github.event_name == 'schedule' && vars.RELIABILITY_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.task == 'reliability')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
      - name: Run reliability suite
        id: reliability
        continue-on-error: true
        env:
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          PUBLIC_URL: ${{ env.PUBLIC_URL }}
        run: |
          OPENAI_API_KEY="$(gcloud secrets versions access latest --secret OPENAI_API_KEY --project "$PROJECT_ID")"
          export OPENAI_API_KEY
          bun run reliability
      - name: Publish step summary
        if: always()
        run: |
          if [ -d "artifacts/reliability" ]; then
            latest_summary="$(find artifacts/reliability -name summary.md | sort | tail -n 1)"
            if [ -n "$latest_summary" ] && [ -f "$latest_summary" ]; then
              cat "$latest_summary" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
      - name: Upload reliability artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-artifacts
          path: artifacts/reliability/
      - name: Propagate reliability outcome
        if: always() && steps.reliability.outcome == 'failure'
        run: exit 1

  agent_loop_acceptance:
    name: Agent loop acceptance
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'agent-loop-acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Run agent loop acceptance
        id: agent-loop
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PUBLIC_URL: ${{ env.PUBLIC_URL }}
        run: bun run docs/evidence/agent-run/deployed-run.ts "$PUBLIC_URL" --profile cache-acceptance
      - name: Authenticate for failure diagnostics
        if: steps.agent-loop.outcome == 'failure'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}
      - name: Set up gcloud for failure diagnostics
        if: steps.agent-loop.outcome == 'failure'
        uses: google-github-actions/setup-gcloud@v3
      - name: Capture sanitized failure diagnostic
        if: steps.agent-loop.outcome == 'failure'
        continue-on-error: true
        run: |
          output="docs/evidence/agent-run/output"
          latest_summary="$(find "$output" -name summary.json | sort | tail -n 1)"
          run_id="$(bun -e 'const value = await Bun.file(Bun.argv[1]).json(); console.log(value.runId ?? "")' "$latest_summary")"
          if [ -n "$run_id" ]; then
            gcloud logging read \
              "resource.type=cloud_run_revision AND jsonPayload.event=run_failed AND jsonPayload.runId=$run_id" \
              --project "$PROJECT_ID" --limit 1 --freshness 15m --format json \
              > "$output/cloud-run-failure.json"
          fi
      - name: Publish agent loop summary
        if: always()
        run: |
          if [ -d "docs/evidence/agent-run/output" ]; then
            latest_summary="$(find docs/evidence/agent-run/output -name summary.json | sort | tail -n 1)"
            if [ -n "$latest_summary" ] && [ -f "$latest_summary" ]; then
              {
                echo '## Agent loop acceptance'
                echo '```json'
                cat "$latest_summary"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
      - name: Upload agent loop artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-loop-acceptance-${{ github.run_id }}
          path: docs/evidence/agent-run/output/
      - name: Propagate agent loop outcome
        if: always() && steps.agent-loop.outcome == 'failure'
        run: exit 1
