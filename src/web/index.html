<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Layerhand is AI retouching that returns a layered PSD, not a flat JPEG." />
    <title>Layerhand - layered AI retouching</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <aside id="desktop-required" role="status">
      <strong>Layerhand needs a wider canvas.</strong>
      <span>This workbench requires a desktop at least 1280 pixels wide.</span>
    </aside>
    <main id="app" aria-live="polite" aria-busy="false"></main>
    <footer id="site-footer" class="site-footer">
      <p class="site-footer__line">A layered PSD, not a flat JPEG.</p>
      <a class="site-footer__source" href="https://github.com/M1KUAPP/astra">Source on GitHub</a>
      <p class="site-footer__wordmark">Layerhand</p>
      <p class="site-footer__credits">
        Built on GPT-6 Astra for the
        <a href="https://www.producthunt.com/contests/gpt-6-astra-challenge">GPT-6 Astra Challenge</a>. Layerhand drives
        <a href="https://www.photopea.com/">Photopea</a>, a web image editor, and is not affiliated with it.
      </p>
    </footer>
    <noscript>Layerhand requires JavaScript to run the retouching workbench.</noscript>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
