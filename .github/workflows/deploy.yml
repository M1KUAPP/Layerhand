# Builds the production image on every push to main and deploys it to Google
# Cloud Run (#24). Nothing is pushed or deployed until the repository variable
# DEPLOY_PLATFORM is set to cloud-run; until then the image is only built.
# Authentication is Workload Identity Federation, restricted to this
# repository, so no Google key exists anywhere. Every secret comes from
# Secret Manager at deploy time and never passes through this workflow.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PROJECT_ID: layerhand-astra-2026
  REGION: us-central1
  SERVICE: layerhand
  IMAGE: us-central1-docker.pkg.dev/layerhand-astra-2026/layerhand/app:${{ github.sha }}
  WORKLOAD_IDENTITY_PROVIDER: projects/732371853772/locations/global/workloadIdentityPools/github/providers/github
  DEPLOYER: deployer@layerhand-astra-2026.iam.gserviceaccount.com
  RUNTIME_SERVICE_ACCOUNT: layerhand-run@layerhand-astra-2026.iam.gserviceaccount.com

jobs:
  image:
    name: Build image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag "$IMAGE" .
      - name: Authenticate to Google Cloud
        if: vars.DEPLOY_PLATFORM == 'cloud-run'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}
      - name: Set up gcloud
        if: vars.DEPLOY_PLATFORM == 'cloud-run'
        uses: google-github-actions/setup-gcloud@v3
      - name: Push to Artifact Registry
        if: vars.DEPLOY_PLATFORM == 'cloud-run'
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker push "$IMAGE"

  deploy:
    name: Deploy to Cloud Run
    needs: image
    if: vars.DEPLOY_PLATFORM == 'cloud-run'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@v3
      # Team secrets live in GitHub repository secrets, their single source.
      # Each is copied into Secret Manager before deploying, adding a version
      # only when its value changed. OPENAI_API_KEY is a personal key and lives
      # only in Secret Manager.
      - name: Sync team secrets into Secret Manager
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
        run: |
          for name in DATABASE_URL SESSION_SECRET S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY BROWSERBASE_API_KEY; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::The GitHub secret $name is not set"
              exit 1
            fi
            current="$(gcloud secrets versions access latest --secret "$name" --project "$PROJECT_ID" 2>/dev/null || true)"
            if [ "$current" = "$value" ]; then
              echo "$name is unchanged"
              continue
            fi
            printf '%s' "$value" | gcloud secrets versions add "$name" --project "$PROJECT_ID" --data-file=-
            echo "$name has a new version"
          done
      # --no-cpu-throttling keeps CPU while no request is open, because a run
      # continues in the background after POST /api/runs returns. One instance
      # at most, because run state lives in that process's memory.
      #
      # FREE_DAILY_BUDGET_USD=10 is a deploy-time placeholder, not the agreed
      # ceiling. The server's OpenAI key is the human's personal balance, so $10
      # bounds it to $10 a day, and admits three concurrent free runs at the $3
      # reservation FREE_RUN_SPEND_CAP_USD sets. RUN_STEP_CAP=40 leaves room over
      # the 19 steps the live run took. docs/TRD.md keeps the ceiling "proposed,
      # not agreed" until kymil4 decides (#29).
      #
      # TRUST_PROXY_HOPS=1 assumes Google's front end appends the client address
      # to X-Forwarded-For. Verify it against a real request after the first
      # deploy.
      - name: Deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --no-cpu-throttling \
            --min-instances 0 \
            --max-instances 1 \
            --timeout 3600 \
            --allow-unauthenticated \
            --set-env-vars "S3_ENDPOINT=https://storage.googleapis.com,S3_REGION=us-central1,S3_BUCKET=layerhand-artifacts-732371853772,TRUST_PROXY_HOPS=1,RUN_MODE=fake,FREE_DAILY_BUDGET_USD=10,RUN_STEP_CAP=40,FREE_RUN_SPEND_CAP_USD=3" \
            --set-secrets "OPENAI_API_KEY=OPENAI_API_KEY:latest,BROWSERBASE_API_KEY=BROWSERBASE_API_KEY:latest,S3_ACCESS_KEY_ID=S3_ACCESS_KEY_ID:latest,S3_SECRET_ACCESS_KEY=S3_SECRET_ACCESS_KEY:latest,SESSION_SECRET=SESSION_SECRET:latest,DATABASE_URL=DATABASE_URL:latest"
      - name: Check the deployed service
        run: |
          url="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format 'value(status.url)')"
          echo "Deployed to $url"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors "$url/health"
