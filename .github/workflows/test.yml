# Runs the deterministic TypeScript suite, plus the fake-backed browser
# tests (RUN_BROWSER_TESTS) against the runner's installed Google Chrome
# (#119). Live Chrome against real Photopea and the network are a separate
# concern: they are opt-in through LAYERHAND_CHROME_INTEGRATION and run on
# a schedule instead (browser-integration.yml), so they cannot block a pull
# request on third-party UI or network availability.
name: Test

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  test:
    name: Test and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun test test/web/application.browser.test.ts test/web/live-frames.browser.test.ts
        env:
          RUN_BROWSER_TESTS: '1'
      - run: bun run typecheck
      # layerhand-mcp (#136) installs and checks on its own, outside the root.
      - run: bun install --frozen-lockfile
        working-directory: packages/layerhand-mcp
      - run: bun test
        working-directory: packages/layerhand-mcp
      - run: bun run typecheck
        working-directory: packages/layerhand-mcp
